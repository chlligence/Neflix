appId: com.neflix.desktop
productName: Neflix
copyright: Copyright © 2026 Neflix Desktop Team

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Neflix

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.entertainment
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: null

dmg:
  title: ${productName} ${version}

publish: null