    <circle r="170" stroke-width="2" stroke-dasharray="18 12"/>
    <ellipse rx="360" ry="120" stroke-width="2" transform="rotate(-18)"/>
    <ellipse rx="360" ry="120" stroke-width="2" transform="rotate(42)"/>
  </g>
  <g fill="#07141b" stroke="#7fc8d9" stroke-width="2">
    <path d="M560 280 L760 200 L950 280 L1010 470 L910 620 L700 640 L580 500 Z"/>
